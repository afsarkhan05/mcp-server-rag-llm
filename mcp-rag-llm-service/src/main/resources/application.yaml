server:
  port: 8080

spring:
  application:
    name: mcp-server-rag-llm

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:rag-llm
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # for claude desktop
  main:
    banner-mode: off
    web-application-type: none

  ai:
    mcp:
      server:
        enabled: true
        stdio: true
        name: mcp-server-rag-llm
        version: 1.0.0
        description: Example MCP Server with RAG LLM
        resourceChangeNotification : true
        toolChangeNotification : true
        promptChangeNotification: true
        sseEndpoint : /mcp/sse
        sseMessageEndpoint: /mcp/sse/message
        type: sync
        capabilities:
          completion: true
          prompt: true
          tool: true
          resource: true



dataFileName: iab.csv

logging:
  level:
    io.modelcontextprotocol: DEBUG
    org.springframework.ai.mcp: DEBUG
    root: OFF
    org.springframework: OFF
    org.hibernate: OFF
    com.zaxxer.hikari: OFF

  # for claude desktop
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
