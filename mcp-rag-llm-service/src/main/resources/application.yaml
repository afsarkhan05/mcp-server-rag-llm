spring:
  profiles:
    active: stdio

  application:
    name: mcp-server-rag-llm

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:rag-llm
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0


  ai:
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        #api-key=<your api key>
        collection-name: redis_qdrant_collection
        # Optional: automatically create the schema/collection if it doesn't exist
        initialize-schema: true

    ollama:
      base-url: http://localhost:11434 #http://host.docker.internal:11434
      chat:
        options:
          model: phi3:mini
      embedding:
        enabled: true
        options:
          model: all-minilm:latest

dataFileName: iab.csv

# Default logging (will be overridden by profiles)
logging:
  level:
    io.modelcontextprotocol: DEBUG
    org.springframework.ai.mcp: DEBUG
    root: WARN  # Changed from OFF to WARN
    org.springframework: WARN  # Changed from OFF
    org.hibernate: WARN  # Changed from OFF
    com.zaxxer.hikari: WARN  # Changed from OFF