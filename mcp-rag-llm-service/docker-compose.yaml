version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - ./docker_compose_storage:/qdrant/storage:z
    restart: unless-stopped
    networks:
      - mcp-network

  redis-stack:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - ./docker_compose_storage:/redis/storage:z
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel warning
    networks:
      - mcp-network

volumes:
  docker_compose_storage:
  redis-stack-data:

networks:
  mcp-network:
    driver: bridge